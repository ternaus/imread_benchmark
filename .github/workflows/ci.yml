name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run pre-commit
        run: uv run pre-commit run --files $(find imread_benchmark tests -name "*.py" | tr '\n' ' ')

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # System libs the [mainstream] wheels dlopen at import time:
      #   libjpeg-turbo8-dev — jpeg4py (built from sdist, needs headers).
      #   libturbojpeg0-dev  — provides libturbojpeg.so.0 reliably across
      #                        Ubuntu releases (noble renamed the runtime-only
      #                        package to `libturbojpeg`; the `0-dev` name is
      #                        the transitional metapackage that pulls the
      #                        correct .so on both jammy and noble).
      # libvips arrives via the `pyvips-binary` PyPI wheel, no apt install.
      # Mirrors gcp/vm_startup.sh for cloud-CI parity.
      - name: Install system C libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libjpeg-turbo8-dev \
            libturbojpeg0-dev

      # `--extra mainstream` brings in opencv, skimage, imageio, kornia-rs,
      # simplejpeg, PyTurboJPEG, imagecodecs, pyvips, Pillow, torch,
      # torchvision, jpeg4py. With this, the cross-decoder agreement test
      # actually compares 11 libs instead of just pillow.
      - name: Install dev + mainstream deps
        run: uv sync --group dev --extra mainstream --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -v

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Check GCP scripts
        run: shellcheck --severity=warning gcp/*.sh
