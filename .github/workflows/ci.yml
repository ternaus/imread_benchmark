name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --group dev
      - run: uv run pre-commit run --all-files

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      CPATH: /opt/libjpeg-turbo/include
      LD_LIBRARY_PATH: /opt/libjpeg-turbo/lib64
      LIBRARY_PATH: /opt/libjpeg-turbo/lib64
      PKG_CONFIG_PATH: /opt/libjpeg-turbo/lib64/pkgconfig
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - name: Install native JPEG libraries
        run: |
          sudo apt-get update -qq
          sudo ./scripts/install-libjpeg-turbo.sh
      - name: Install locked mainstream environment
        run: uv sync --frozen --group dev --extra mainstream --python ${{ matrix.python-version }}
      - name: Run complete suite
        run: uv run --python ${{ matrix.python-version }} pytest -q

  package:
    name: Wheel and CLI smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - run: uv sync --frozen --group dev
      - run: uv build
      - run: uv run imread-benchmark --help
      - run: uv run imread-benchmark list-decoders

  shellcheck:
    name: GCP bootstrap shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: shellcheck --severity=warning gcp/*.sh
      - run: bash -n gcp/run.sh gcp/run-many.sh gcp/vm_startup.sh
